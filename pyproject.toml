[project]
name = "poetry-demo"
version = "0.1.0"
description = ""
authors = [
    {name = "MarioRodriguezJimeno",email = "mrodrjim@emeal.nttdata.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard] (>=0.138.0,<0.139.0)",
    "httpx (>=0.28.1,<0.29.0)"
]
license = {text = "Apache-2.0"}
 
[tool.poetry]
packages = [{include = "poetry_demo", from = "src"}]
 
[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pre-commit (>=4.6.0,<5.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "ruff (>=0.15.20,<0.16.0)",
    "flake8 (==7.0.0)",
    "pyproject-flake8 (>=7.0.0,<8.0.0)",
    "bandit[toml] (>=1.9.4,<2.0.0)"
]

